<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puck Shot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>Puck Shot</h1>
        <p>Click the puck to shoot!</p>

        <div class="rink">
            <div class="net"></div>
            <div class="puck" onclick="shootPuck()"></div>
        </div>
    </div>

    <script>
        function shootPuck() {
            const puck = document.querySelector(".puck");

            puck.classList.add("shoot");

            setTimeout(function() {
                puck.classList.remove("shoot");
            }, 500);
        }
    </script>

</body>
</html>

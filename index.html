<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puck Shot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>Puck Shot</h1>

        <p>Tap the puck to shoot!</p>

        <div class="rink">
            <div class="net"></div>

            <img src="ice.jpg" alt="Hockey puck" class="puck" onclick="shootPuck()">
        </div>
    </div>

    <script>
        function shootPuck() {
            const puck = document.querySelector(".puck");

            puck.classList.add("shoot");

            setTimeout(() => {
                puck.classList.remove("shoot");
            }, 500);
        }
    </script>

</body>
</html>
